# Command: consent-mock-cm query /absolute/rendered/02-cm-query-before.ini
# Run against a fresh isolated PoC state before the UI approval.
# Values are literal UTF-8; the orchestration script must reject unexpanded @...@ tokens.

[mock]
id=02-cm-query-before
expect_decision=CONSENT_REQUIRED

[params]
subject=owner
profile=default
count=1
r0.definition=mock.location
r0.policy_version=2
r0.operation=read
r0.scope=30
r0.purpose=mock-answer
r0.recipient=mock-local
r0.holder=mock-holder
