#
# Command: consent-mock-installer register /absolute/rendered/01-installer-register.ini
# Replace @INSTALL_GENERATION@ with the active protected installation generation.
# Register this actual installed package/app; never invent an installation record.
# Values are literal UTF-8; the orchestration script must reject unexpanded @...@ tokens.

[mock]
id=01-installer-register
package=org.tizen.consentui
app=org.tizen.consentui

[params]
definition=mock.location
operation_id=mock-location-register-v2-@INSTALL_GENERATION@
expected_generation=@INSTALL_GENERATION@
enforcer=mock-ce
policy_version=2
text_revision=2
level=1
modes=ONCE
retention_ms=60000
default_locale=en
locale_fallback.en-US=en
locale_fallback.ko-KR=ko
template_version=1
parameter.scope.type=string
parameter.scope.source=scope
parameter.scope.max_bytes=512
parameter.purpose.type=string
parameter.purpose.source=purpose
parameter.purpose.max_bytes=256
parameter.recipient.type=string
parameter.recipient.source=recipient
parameter.recipient.max_bytes=512
message.en.title=Read location history
message.en.body=Allow one read of mock location scope "{scope}" for purpose "{purpose}" and recipient "{recipient}"? Keep acquired mock data for at most 60 seconds.
message.ko.title=위치 기록 읽기
message.ko.body=범위 "{scope}"의 모의 위치 기록을 목적 "{purpose}", 수신자 "{recipient}"에 대해 한 번 읽도록 허용합니까? 취득한 모의 데이터는 최대 60초 동안 보관합니다.
