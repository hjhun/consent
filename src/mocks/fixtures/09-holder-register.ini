# Command: consent-mock-holder data-register /absolute/rendered/09-holder-register.ini
# Keep holder in serve mode for register/derive/reuse/release.
# Substitute result.artifact as @ARTIFACT@; the mock retains only its bounded fixture buffer.
# Values are literal UTF-8; the orchestration script must reject unexpanded @...@ tokens.

[mock]
id=09-holder-register
payload=Original mock location fixture; no real user data.

[params]
subject=owner
profile=default
session=@SESSION@
generation=@SESSION_GENERATION@
scope=30
purpose=mock-answer
recipient=mock-local
receipt=@RECEIPT@
storage_class=MEMORY_ONLY
