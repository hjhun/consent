#
# Command: consent-mock-argo request /absolute/rendered/03-argo-request.ini
# Keep argo in serve mode. Forward its pending.request_id to the real approval UI.
# A human must select ALLOW/ONCE; this file contains no approval response.
# Approval is sessionless so human interaction cannot exhaust a holder session lease.
# Values are literal UTF-8; the orchestration script must reject unexpanded @...@ tokens.

[mock]
id=03-argo-request
timeout_ms=180000
expect_decision=ALLOWED

[params]
subject=owner
profile=default
count=1
r0.definition=mock.location
r0.policy_version=2
r0.operation=read
r0.scope=30
r0.purpose=mock-answer
r0.recipient=mock-local
r0.holder=mock-holder
operation_id=mock-location-approval
client_request_id=mock-location-approval-client
deadline_ms=180000
