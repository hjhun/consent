# Consent service identity policy. No identities are authorized by default.
# This file and each configured executable must be root-owned and must not be
# writable by group or other users. Populate it through trusted platform
# integration only. Transport access does not establish an application role.
#
# Each [identity NAME] section requires:
# uid=<numeric uid>
# executable=<absolute executable path>
# label=<exact kernel SO_PEERSEC label>
# roles=<semicolon-separated role names>
# subjects=<semicolon-separated delegated subject identities>
# profiles=<semicolon-separated authorized profile identities>
# enforcers=<semicolon-separated delegated enforcement identities>
# packages=<semicolon-separated installer package delegations>
#
# Test identities are deliberately not installed into this production policy.

[policy]
version=1
